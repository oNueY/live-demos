<main class="phone">
  <div class="top">
    <span class="status" id="status"></span>
    <span class="lang"><button data-lang="de">DE</button><button data-lang="ja">日本語</button></span>
  </div>
  <h1 id="title">…</h1>
  <div class="count-big"><b id="online">0</b> <span data-t="phones"></span></div>
  <p class="hint danger" id="noscreen" data-t="mod_need_screen" hidden></p>

  <nav class="tabs">
    <button data-tab="q" class="on" data-t="tab_q"></button>
    <button data-tab="color" data-t="tab_color"></button>
  </nav>

  <section class="pane on" id="pane-q">
    <label class="switch"><input type="checkbox" id="review"> <span data-t="review"></span></label>

    <h2 data-t="pending"></h2>
    <div id="pending"></div>

    <h2 data-t="shown"></h2>
    <div id="shown"></div>

    <details>
      <summary data-t="hidden_head"></summary>
      <div id="hidden"></div>
    </details>

    <h2 data-t="title"></h2>
    <div class="titlerow"><input id="titlein" maxlength="120"><button class="btn" id="titlesave" data-t="save"></button></div>

    <div class="row" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px">
      <button class="btn" id="samples" data-t="samples"></button>
      <button class="btn ghost danger" id="reset" data-t="reset"></button>
    </div>
  </section>

  <section class="pane" id="pane-color">
    <h2 data-t="color_head"></h2>
    <p class="hint" data-t="color_hint"></p>
    <div class="swatches" id="swatches"></div>
    <button class="btn" id="rainbow">🌈 <span data-t="rainbow"></span></button>
    <button class="btn primary" id="wall" data-t="back_wall"></button>
  </section>

  <footer class="made" id="made"></footer>
</main>


<div class="gate" id="gate" hidden>
  <form class="box">
    <h2>Passwort · パスワード</h2>
    <input type="password" id="pw" autocomplete="current-password" required>
    <button class="btn primary">OK</button>
    <p class="err" id="pwerr"></p>
  </form>
</div>

  const SAVED = 'lw-pw';
  const un = (s) => Uint8Array.from(atob(s), (ch) => ch.charCodeAt(0));
  async function open(pw) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: un(BLOB.s), iterations: BLOB.n, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);

    return new TextDecoder().decode(pt);

  const run = (code) => { gate.remove(); new Function(code)(); };
  (async () => {
    const saved = localStorage.getItem(SAVED);
    if (saved) { try { return run(await open(saved)); } catch { localStorage.removeItem(SAVED); } }
    gate.hidden = false;
    document.getElementById('pw').focus();
    gate.querySelector('form').onsubmit = async (e) => {
      e.preventDefault();
      const pw = document.getElementById('pw').value;
      try { const code = await open(pw); localStorage.setItem(SAVED, pw); run(code); }
      catch { document.getElementById('pwerr').textContent = 'Falsch · 違います'; }
    };
  })();
